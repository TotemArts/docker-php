name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Each 8.* branch is a PHP flavor (8.2, 8.3, 8.3-alpine, ...) and is published
# as ghcr.io/<owner>/php:<branch>. Branches whose Dockerfile has an
# `ARG ROOTLESS` also get a ghcr.io/<owner>/php:<branch>-rootless variant.
#
# Scheduled runs only execute the workflow file on the default branch, so the
# schedule and workflow_dispatch triggers rebuild every 8.* branch from there.
# Push and pull_request runs build just the branch they were triggered on.

on:
  schedule:
    - cron: '0 4 * * 3'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (blank for every 8.* branch)'
        required: false
        default: ''
  push:
    branches:
      - '8.*'
  pull_request:
    branches:
    - '8.*'

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: "${{ github.repository_owner }}/php"

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One entry per branch, plus a -rootless entry for branches that support it.
      - name: Compute build matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)         branches="$REF_NAME" ;;
            pull_request) branches="$BASE_REF" ;;
            *)
              if [ -n "$INPUT_BRANCH" ]; then
                branches="$INPUT_BRANCH"
              else
                branches="$(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/8.*')"
              fi
              ;;
          esac

          include='[]'
          for branch in $branches; do
            # Push and PR builds use the triggering commit, scheduled builds the branch tip.
            if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
              ref="$GITHUB_SHA"
              rev="$GITHUB_SHA"
            else
              ref="$branch"
              rev="origin/$branch"
            fi

            dockerfile="$(git show "$rev:Dockerfile")"
            if grep -q '^ARG ROOTLESS=' <<< "$dockerfile"; then
              entries="$(jq -nc --arg b "$branch" --arg r "$ref" '[
                {branch: $b, ref: $r, variant: "default",  suffix: "",          build_args: "ROOTLESS=false"},
                {branch: $b, ref: $r, variant: "rootless", suffix: "-rootless", build_args: "ROOTLESS=true"}
              ]')"
            else
              entries="$(jq -nc --arg b "$branch" --arg r "$ref" '[
                {branch: $b, ref: $r, variant: "default", suffix: "", build_args: ""}
              ]')"
            fi
            include="$(jq -nc --argjson a "$include" --argjson b "$entries" '$a + $b')"
          done

          echo "matrix=$(jq -nc --argjson i "$include" '{include: $i}')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    name: build (${{ matrix.branch }}${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get checked-out revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.suffix }}
          # The tag comes from the matrix, not the event ref, because scheduled
          # runs build every branch from the default branch's context.
          tags: |
            type=raw,value=${{ matrix.branch }}
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.branch }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.branch }}${{ matrix.suffix }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
